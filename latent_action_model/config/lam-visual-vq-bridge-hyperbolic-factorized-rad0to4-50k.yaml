model:
  image_channels: 3

  lam_model_dim: 768
  lam_latent_dim: 128
  lam_num_latents: 32
  lam_patch_size: 14
  lam_enc_blocks: 12
  lam_dec_blocks: 12
  lam_num_heads: 12

  use_vq: true
  vq_type: factorized
  factorized_vq_num_radius: 16
  factorized_vq_num_directions: 16
  factorized_vq_radius_values: "0.0,0.2666667,0.5333333,0.8,1.0666667,1.3333333,1.6,1.8666667,2.1333333,2.4,2.6666667,2.9333333,3.2,3.4666667,3.7333333,4.0"
  vq_beta: 0.25
  vq_restart_interval_steps: 10000
  radprog_radial_weight: 1.0
  radprog_progress_weight: 0.3
  radprog_codebook_aux_weight: 0.0
  radprog_progress_alpha: 0.05
  hyperbolic_latent_enabled: true
  hyperbolic_curvature: 1.0
  hyperbolic_prelift_mode: scale
  hyperbolic_prelift_scale: 0.05
  hyperbolic_tangent_max_norm: 0.0
  hyperbolic_lift_max_norm: 0.0
  hyperbolic_eps: 1e-5
  latent_output_global_scale: 1.0
  action_probe_enabled: true
  action_probe_shuffle: true
  action_probe_lr: 1e-3
  log_interval: 5000
  log_path: /NHNHOME/WORKSPACE/0526040036_A/BASE/user/01/youngjoonjeong/outputs/lam_bridge/logs
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 1e-4
      weight_decay: 1e-2

  task_name: visual_vq_lam_bridge_hyperbolic_factorized_rad16_0to4_dir16_rad1_dir4tokens_prelift_hmax9_50k_workers2
  make_data_pair: &make_data_pair false

data:
  data_root: /NHNHOME/WORKSPACE/0526040036_A/BASE/user/01/youngjoonjeong/data/rlds_bridge_orig
  data_mix: bridge
  batch_size: 64
  resolution: 224
  num_frames: 16
  lam_window_size: 10
  lam_random_horizon: true
  episodic: false
  shuffle_buffer_size: 20000
  image_aug: true
  make_data_pair: *make_data_pair
  workers: 2
  train: true

trainer:
  max_steps: 50000
  log_every_n_steps: 50
  num_sanity_val_steps: 0
  default_root_dir: /NHNHOME/WORKSPACE/0526040036_A/BASE/user/01/youngjoonjeong/outputs/lam_bridge/logs
  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        dirpath: /NHNHOME/WORKSPACE/0526040036_A/BASE/user/01/youngjoonjeong/outputs/lam_bridge/logs/visual_vq_lam_bridge_hyperbolic_factorized_rad16_0to4_dir16_rad1_dir4tokens_prelift_hmax9_50k_workers2
        save_top_k: -1
        every_n_train_steps: 10000
        save_on_train_epoch_end: false
  logger:
    class_path: pytorch_lightning.loggers.WandbLogger
    init_args:
      name: visual_vq_lam_bridge_hyperbolic_factorized_rad16_0to4_dir16_rad1_dir4tokens_prelift_hmax9_50k_workers2
      project: latent_action_model
      entity: joonstack
