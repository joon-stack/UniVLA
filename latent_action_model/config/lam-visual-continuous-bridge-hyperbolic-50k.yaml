model:
  image_channels: 3

  lam_model_dim: 768
  lam_latent_dim: 128
  lam_num_latents: 16
  lam_patch_size: 14
  lam_enc_blocks: 12
  lam_dec_blocks: 12
  lam_num_heads: 12

  use_vq: false
  vq_beta: 0.0
  vq_restart_interval_steps: 0
  radprog_radial_weight: 1.0
  radprog_progress_weight: 0.3
  radprog_codebook_aux_weight: 0.0
  radprog_progress_alpha: 0.05
  hyperbolic_latent_enabled: true
  hyperbolic_curvature: 1.0
  hyperbolic_prelift_mode: scale
  hyperbolic_prelift_scale: 0.05
  hyperbolic_tangent_max_norm: 0.0
  hyperbolic_lift_max_norm: 0.0
  hyperbolic_eps: 1e-5
  latent_output_global_scale: 1.0
  action_probe_enabled: true
  action_probe_shuffle: true
  action_probe_lr: 1e-3
  log_interval: 5000
  log_path: /NHNHOME/WORKSPACE/0526040036_A/BASE/user/01/youngjoonjeong/outputs/lam_bridge/logs
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 1e-4
      weight_decay: 1e-2

  task_name: visual_cont_lam_bridge_hyperbolic_prelift_radprog_hmax9_50k_workers2
  make_data_pair: &make_data_pair false

data:
  data_root: /NHNHOME/WORKSPACE/0526040036_A/BASE/user/01/youngjoonjeong/data/rlds_bridge_orig
  data_mix: bridge
  batch_size: 64
  resolution: 224
  num_frames: 16
  lam_window_size: 10
  lam_random_horizon: true
  episodic: false
  shuffle_buffer_size: 20000
  image_aug: true

trainer:
  max_epochs: 20
  max_steps: 50000
  accelerator: gpu
  num_nodes: 1
  devices: 8
  strategy: ddp_find_unused_parameters_false
  precision: 16-mixed
  log_every_n_steps: 1
  gradient_clip_val: 0.1

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: /NHNHOME/WORKSPACE/0526040036_A/BASE/user/01/youngjoonjeong/outputs/lam_bridge/logs/visual_cont_lam_bridge_hyperbolic_prelift_radprog_hmax9_50k_workers2
        verbose: true
        save_last: true
        save_top_k: -1
        every_n_train_steps: 10000

  logger:
    - class_path: lightning.pytorch.loggers.WandbLogger
      init_args:
        project: univla_lam_bridge
        entity: joonstack
        name: visual_cont_lam_bridge_hyperbolic_prelift_radprog_hmax9_50k_workers2
